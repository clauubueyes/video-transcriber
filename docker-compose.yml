services:
  video-transcriber:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./tmp:/app/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  video-transcriber-worker:
    build: .
    profiles: ["worker"]
    command: ["python", "-m", "app.workers.cli"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./tmp:/app/tmp
