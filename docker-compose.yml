services:
  video-transcriber:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./tmp:/app/tmp

  video-transcriber-worker:
    build: .
    profiles: ["worker"]
    command: ["python", "-m", "app.workers.cli"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./tmp:/app/tmp
